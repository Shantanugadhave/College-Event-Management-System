<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications Center | College Event Management System</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">

  <div id="navbar-container"></div>

  <div class="container-xl py-4">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <!-- Notification Hub Card -->
        <div class="card border-0 shadow-sm rounded-4 overflow-hidden bg-white">
          <div class="p-4 border-bottom d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-3">
            <div>
              <h3 class="fw-bold text-dark mb-0">Notifications & Alerts</h3>
              <p class="text-muted small mb-0">Event schedule updates, approval notices, and RSVP confirmations.</p>
            </div>
            <div class="d-flex gap-2">
              <button id="mark-all-read-btn" class="btn btn-sm btn-outline-primary rounded-pill px-3">
                <i class="bi bi-check2-all me-1"></i> Mark All as Read
              </button>
              <button id="clear-all-btn" class="btn btn-sm btn-outline-danger rounded-pill px-3">
                <i class="bi bi-trash me-1"></i> Clear All
              </button>
            </div>
          </div>

          <!-- Filter Pills -->
          <div class="p-3 bg-light border-bottom d-flex flex-wrap gap-2">
            <button class="btn btn-sm btn-primary rounded-pill px-3 filter-pill active" data-filter="all">
              All
            </button>
            <button class="btn btn-sm btn-outline-secondary rounded-pill px-3 filter-pill" data-filter="unread">
              Unread Only
            </button>
            <button class="btn btn-sm btn-outline-secondary rounded-pill px-3 filter-pill" data-filter="registration">
              Registrations
            </button>
            <button class="btn btn-sm btn-outline-secondary rounded-pill px-3 filter-pill" data-filter="event-update">
              Event Updates
            </button>
            <button class="btn btn-sm btn-outline-secondary rounded-pill px-3 filter-pill" data-filter="approval">
              Approvals
            </button>
            <button class="btn btn-sm btn-outline-secondary rounded-pill px-3 filter-pill" data-filter="rejection">
              Rejections
            </button>
            <button class="btn btn-sm btn-outline-secondary rounded-pill px-3 filter-pill" data-filter="announcement">
              Announcements
            </button>
          </div>

          <!-- Notification Items List -->
          <div id="notifications-list" class="p-4 d-flex flex-column gap-3">
            <div class="text-center py-5">
              <div class="spinner-border text-primary" role="status"></div>
              <p class="mt-2 text-muted">Checking alerts...</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="footer-container"></div>
  <div id="toast-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/navbar.js"></script>

  <script>
    let notifications = [];
    let currentFilter = 'all';

    document.addEventListener('DOMContentLoaded', async () => {
      if (!Auth.requireAuth()) return;

      await loadNotifications();

      // Action buttons
      document.getElementById('mark-all-read-btn').addEventListener('click', async () => {
        try {
          const res = await api.put('/api/notifications/read-all');
          if (res.success) {
            Utils.showToast('All notifications marked as read', 'success');
            await loadNotifications();
          }
        } catch (err) {
          Utils.showToast(err.message, 'error');
        }
      });

      document.getElementById('clear-all-btn').addEventListener('click', async () => {
        if (!confirm('Clear all notifications? This cannot be undone.')) return;
        try {
          const res = await api.delete('/api/notifications/clear-all');
          if (res.success) {
            Utils.showToast('All notifications cleared', 'info');
            await loadNotifications();
          }
        } catch (err) {
          Utils.showToast(err.message, 'error');
        }
      });

      // Filter pills
      document.querySelectorAll('.filter-pill').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.filter-pill').forEach(b => {
            b.className = 'btn btn-sm btn-outline-secondary rounded-pill px-3 filter-pill';
          });
          btn.className = 'btn btn-sm btn-primary rounded-pill px-3 filter-pill active';
          currentFilter = btn.getAttribute('data-filter');
          renderNotifications();
        });
      });
    });

    async function loadNotifications() {
      const container = document.getElementById('notifications-list');
      try {
        const res = await api.get('/api/notifications');
        if (!res.success || !res.data) {
          container.innerHTML = '<div class="alert alert-danger">Error retrieving notifications.</div>';
          return;
        }

        notifications = res.data.notifications || [];
        renderNotifications();
      } catch (err) {
        container.innerHTML = `<div class="alert alert-danger">${err.message}</div>`;
      }
    }

    function renderNotifications() {
      const container = document.getElementById('notifications-list');

      let filtered = notifications;
      if (currentFilter === 'unread') {
        filtered = notifications.filter(n => !n.isRead);
      } else if (currentFilter !== 'all') {
        filtered = notifications.filter(n => n.type === currentFilter);
      }

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="text-center py-5">
            <div class="empty-state-icon"><i class="bi bi-bell-slash"></i></div>
            <h5 class="fw-bold">No Notifications</h5>
            <p class="text-muted small">You're completely caught up on campus events and announcements!</p>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(n => {
        let iconClass = 'bi-bell-fill text-primary';
        let bgLight = 'bg-light';
        if (n.type === 'registration') { iconClass = 'bi-ticket-perforated-fill text-success'; }
        if (n.type === 'cancellation') { iconClass = 'bi-x-octagon-fill text-danger'; }
        if (n.type === 'approval') { iconClass = 'bi-check-circle-fill text-success'; }
        if (n.type === 'rejection') { iconClass = 'bi-x-circle-fill text-danger'; }
        if (n.type === 'announcement') { iconClass = 'bi-megaphone-fill text-warning'; }
        if (n.type === 'event-update') { iconClass = 'bi-calendar-event-fill text-info'; }

        const eventTargetId = n.event?._id || n.event;
        const eventLink = eventTargetId
          ? `<a href="/event-details.html?id=${eventTargetId}" class="small text-primary text-decoration-none fw-semibold d-inline-block mt-1"><i class="bi bi-box-arrow-up-right me-1"></i>View Event Details</a>`
          : '';

        return `
          <div class="p-3 rounded-4 border d-flex align-items-start justify-content-between gap-3 ${!n.isRead ? 'bg-primary bg-opacity-10 border-primary border-opacity-25' : 'bg-white'}">
            <div class="d-flex align-items-start gap-3">
              <div class="stat-icon-wrapper rounded-3" style="width:40px; height:40px; font-size:1.2rem; background: rgba(99, 102, 241, 0.1);">
                <i class="bi ${iconClass}"></i>
              </div>
              <div>
                <div class="d-flex align-items-center gap-2">
                  <h6 class="fw-bold text-dark mb-0">${Utils.escapeHtml(n.title)}</h6>
                  ${!n.isRead ? '<span class="badge bg-primary" style="font-size:0.65rem;">NEW</span>' : ''}
                </div>
                <p class="small text-secondary mb-1 mt-1">${Utils.escapeHtml(n.message)}</p>
                <div class="text-muted" style="font-size:0.75rem;">${Utils.formatDate(n.createdAt)} &bull; Type: <span class="fw-semibold">${n.type}</span></div>
                ${eventLink}
              </div>
            </div>

            <div class="d-flex align-items-center gap-1 flex-shrink-0">
              ${!n.isRead ? `
                <button class="btn btn-sm btn-outline-primary border-0 rounded-circle" onclick="markRead('${n._id}')" title="Mark as read">
                  <i class="bi bi-check2"></i>
                </button>
              ` : ''}
              <button class="btn btn-sm btn-outline-danger border-0 rounded-circle" onclick="deleteNotif('${n._id}')" title="Delete">
                <i class="bi bi-x-lg"></i>
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    async function markRead(id) {
      try {
        await api.put(`/api/notifications/${id}/read`);
        await loadNotifications();
      } catch (err) {
        Utils.showToast(err.message, 'error');
      }
    }

    async function deleteNotif(id) {
      try {
        await api.delete(`/api/notifications/${id}`);
        await loadNotifications();
      } catch (err) {
        Utils.showToast(err.message, 'error');
      }
    }
  </script>
</body>
</html>
