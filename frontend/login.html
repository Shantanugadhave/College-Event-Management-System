<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | College Event Management System</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">

  <div id="navbar-container"></div>

  <div class="container py-5 my-auto">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-5">
        <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
          <div class="p-4 p-sm-5 bg-white">
            <div class="text-center mb-4">
              <div class="navbar-brand-icon mx-auto mb-3" style="width:48px; height:48px; font-size:1.5rem;">
                <i class="bi bi-person-lock"></i>
              </div>
              <h3 class="fw-bold text-dark">Welcome Back</h3>
              <p class="text-muted small">Sign in to access your registrations, events, and portal</p>
            </div>

            <!-- Demo Quick-Fill Buttons -->
            <div class="p-3 mb-4 rounded-3 bg-light border">
              <div class="small fw-bold text-muted mb-2 text-uppercase" style="letter-spacing:0.04em;">
                <i class="bi bi-magic me-1 text-primary"></i> 1-Click Demo Accounts:
              </div>
              <div class="d-flex flex-wrap gap-2">
                <button type="button" class="btn btn-sm btn-outline-danger flex-grow-1" onclick="fillCredentials('admin@college.com', 'Admin@123')">
                  Admin
                </button>
                <button type="button" class="btn btn-sm btn-outline-primary flex-grow-1" onclick="fillCredentials('organizer@college.com', 'Organizer@123')">
                  Organizer
                </button>
                <button type="button" class="btn btn-sm btn-outline-success flex-grow-1" onclick="fillCredentials('student@college.com', 'Student@123')">
                  Student
                </button>
              </div>
            </div>

            <!-- Alert Container -->
            <div id="login-alert" class="alert alert-danger d-none" role="alert"></div>

            <form id="login-form">
              <div class="mb-3">
                <label for="email" class="form-label small fw-semibold">Email Address</label>
                <div class="input-group">
                  <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
                  <input type="email" id="email" class="form-control border-start-0 ps-0" placeholder="name@college.com" required>
                </div>
              </div>

              <div class="mb-4">
                <div class="d-flex justify-content-between">
                  <label for="password" class="form-label small fw-semibold">Password</label>
                </div>
                <div class="input-group">
                  <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-lock"></i></span>
                  <input type="password" id="password" class="form-control border-start-0 border-end-0 ps-0" placeholder="••••••••" required>
                  <button type="button" class="input-group-text bg-white border-start-0 text-muted" id="togglePassword">
                    <i class="bi bi-eye"></i>
                  </button>
                </div>
              </div>

              <button type="submit" id="submit-btn" class="btn btn-primary w-100 py-2 rounded-3 fw-bold">
                Sign In
              </button>
            </form>

            <div class="text-center mt-4 pt-3 border-top">
              <span class="text-muted small">Don't have an account yet? </span>
              <a href="/register.html" class="fw-bold small text-primary">Register Here</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="footer-container"></div>
  <div id="toast-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/navbar.js"></script>

  <script>
    function fillCredentials(email, password) {
      document.getElementById('email').value = email;
      document.getElementById('password').value = password;
      Utils.showToast(`Autofilled: ${email}`, 'info', 2000);
    }

    document.addEventListener('DOMContentLoaded', () => {
      // If already logged in, redirect
      if (Auth.isLoggedIn()) {
        const user = Auth.getCurrentUser();
        if (user.role === 'admin') window.location.href = '/admin-dashboard.html';
        else if (user.role === 'organizer') window.location.href = '/organizer-dashboard.html';
        else window.location.href = '/student-dashboard.html';
        return;
      }

      const params = new URLSearchParams(window.location.search);
      if (params.get('expired')) {
        Utils.showToast('Your session has expired. Please sign in again.', 'warning');
      }

      // Password toggle
      const toggleBtn = document.getElementById('togglePassword');
      const passInput = document.getElementById('password');
      toggleBtn.addEventListener('click', () => {
        const type = passInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passInput.setAttribute('type', type);
        toggleBtn.querySelector('i').className = type === 'password' ? 'bi bi-eye' : 'bi bi-eye-slash';
      });

      // Login form submission
      const form = document.getElementById('login-form');
      const alertBox = document.getElementById('login-alert');
      const submitBtn = document.getElementById('submit-btn');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        alertBox.classList.add('d-none');
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Signing In...';

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        try {
          const response = await api.post('/api/auth/login', { email, password });
          if (response.success && response.data) {
            Auth.setAuthSession(response.data.token, response.data.user);
            Utils.showToast('Welcome back, ' + response.data.user.name + '!', 'success');

            const redirectUrl = params.get('redirect');
            setTimeout(() => {
              if (redirectUrl) {
                window.location.href = decodeURIComponent(redirectUrl);
              } else if (response.data.user.role === 'admin') {
                window.location.href = '/admin-dashboard.html';
              } else if (response.data.user.role === 'organizer') {
                window.location.href = '/organizer-dashboard.html';
              } else {
                window.location.href = '/student-dashboard.html';
              }
            }, 800);
          }
        } catch (error) {
          alertBox.innerText = error.message || 'Login failed. Please verify credentials.';
          alertBox.classList.remove('d-none');
          submitBtn.disabled = false;
          submitBtn.innerHTML = 'Sign In';
        }
      });
    });
  </script>
</body>
</html>
