<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Profile | College Event Management System</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">

  <div id="navbar-container"></div>

  <div class="container-xl py-5">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <!-- Profile Card -->
        <div class="card border-0 shadow-sm rounded-4 overflow-hidden mb-4 bg-white">
          <div class="p-4 p-sm-5 border-bottom bg-gradient" style="background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);">
            <div class="d-flex flex-column flex-sm-row align-items-center gap-4 text-center text-sm-start">
              <div class="user-nav-avatar bg-white text-primary d-flex align-items-center justify-content-center fw-bold fs-1 shadow" style="width: 80px; height: 80px; font-size: 2rem !important;" id="profile-avatar-display">
                U
              </div>
              <div class="text-white">
                <h3 class="fw-bold mb-1" id="profile-name-header">User Name</h3>
                <p class="mb-2 opacity-75 small" id="profile-email-header">user@college.com</p>
                <div class="d-flex flex-wrap gap-2 justify-content-center justify-content-sm-start">
                  <span class="badge bg-white text-dark small" id="profile-role-badge">STUDENT</span>
                  <span class="badge bg-success bg-opacity-25 text-white border border-white border-opacity-25 small" id="profile-verified-badge">VERIFIED</span>
                </div>
              </div>
            </div>
          </div>

          <div class="p-4 p-sm-5">
            <form id="profile-form">
              <h5 class="fw-bold text-dark mb-3">Personal & Contact Details</h5>

              <div class="row g-3 mb-4">
                <div class="col-md-6">
                  <label for="prof-name" class="form-label small fw-semibold">Full Name</label>
                  <input type="text" id="prof-name" class="form-control" required minlength="2">
                </div>
                <div class="col-md-6">
                  <label for="prof-phone" class="form-label small fw-semibold">Phone Number</label>
                  <input type="tel" id="prof-phone" class="form-control" required>
                </div>
                <div class="col-md-6">
                  <label class="form-label small fw-semibold">Email Address (Read-only)</label>
                  <input type="email" id="prof-email" class="form-control bg-light" disabled>
                </div>
                <div class="col-md-6" id="prof-org-group">
                  <label for="prof-org" class="form-label small fw-semibold">Organization Registration Ref</label>
                  <input type="text" id="prof-org" class="form-control" placeholder="CEC-2026-REG-882">
                </div>
              </div>

              <!-- Interests Selection -->
              <h5 class="fw-bold text-dark mb-3">Event Categories of Interest</h5>
              <div class="d-flex flex-wrap gap-2 mb-4">
                <div class="form-check form-check-inline m-0">
                  <input class="btn-check" type="checkbox" name="prof-interest" id="pi-workshop" value="Workshop">
                  <label class="btn btn-sm btn-outline-primary rounded-pill px-3" for="pi-workshop">Workshop</label>
                </div>
                <div class="form-check form-check-inline m-0">
                  <input class="btn-check" type="checkbox" name="prof-interest" id="pi-cultural" value="Cultural">
                  <label class="btn btn-sm btn-outline-primary rounded-pill px-3" for="pi-cultural">Cultural</label>
                </div>
                <div class="form-check form-check-inline m-0">
                  <input class="btn-check" type="checkbox" name="prof-interest" id="pi-academic" value="Academic">
                  <label class="btn btn-sm btn-outline-primary rounded-pill px-3" for="pi-academic">Academic</label>
                </div>
                <div class="form-check form-check-inline m-0">
                  <input class="btn-check" type="checkbox" name="prof-interest" id="pi-sports" value="Sports">
                  <label class="btn btn-sm btn-outline-primary rounded-pill px-3" for="pi-sports">Sports</label>
                </div>
                <div class="form-check form-check-inline m-0">
                  <input class="btn-check" type="checkbox" name="prof-interest" id="pi-social" value="Social">
                  <label class="btn btn-sm btn-outline-primary rounded-pill px-3" for="pi-social">Social</label>
                </div>
                <div class="form-check form-check-inline m-0">
                  <input class="btn-check" type="checkbox" name="prof-interest" id="pi-seminar" value="Seminar">
                  <label class="btn btn-sm btn-outline-primary rounded-pill px-3" for="pi-seminar">Seminar</label>
                </div>
              </div>

              <!-- Notification Preferences -->
              <h5 class="fw-bold text-dark mb-3">Notification Preferences</h5>
              <div class="mb-4">
                <div class="form-check form-switch mb-2">
                  <input class="form-check-input" type="checkbox" role="switch" id="pref-email-notif" checked>
                  <label class="form-check-label small fw-semibold text-dark" for="pref-email-notif">
                    Receive event updates & RSVP reminders
                  </label>
                </div>
                <div class="form-check form-switch">
                  <input class="form-check-input" type="checkbox" role="switch" id="pref-announcements" checked>
                  <label class="form-check-label small fw-semibold text-dark" for="pref-announcements">
                    Receive campus broadcast announcements
                  </label>
                </div>
              </div>

              <!-- Update Password (Optional) -->
              <h5 class="fw-bold text-dark mb-3">Security & Password</h5>
              <div class="row g-3 mb-4">
                <div class="col-md-6">
                  <label for="prof-new-pass" class="form-label small fw-semibold">New Password (leave blank to keep current)</label>
                  <input type="password" id="prof-new-pass" class="form-control" placeholder="Min. 6 characters">
                </div>
              </div>

              <div class="d-flex justify-content-end">
                <button type="submit" id="save-profile-btn" class="btn btn-primary px-4 py-2 rounded-pill fw-bold">
                  Save Profile Changes
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="footer-container"></div>
  <div id="toast-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/navbar.js"></script>

  <script>
    let currentUser = null;

    document.addEventListener('DOMContentLoaded', async () => {
      if (!Auth.requireAuth()) return;

      await loadProfileData();

      document.getElementById('profile-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const saveBtn = document.getElementById('save-profile-btn');
        saveBtn.disabled = true;
        saveBtn.innerText = 'Saving...';

        const name = document.getElementById('prof-name').value.trim();
        const phone = document.getElementById('prof-phone').value.trim();
        const organizationNumber = document.getElementById('prof-org').value.trim();
        const newPass = document.getElementById('prof-new-pass').value;

        const interestBoxes = document.querySelectorAll('input[name="prof-interest"]:checked');
        const interests = Array.from(interestBoxes).map(b => b.value);

        const emailNotifications = document.getElementById('pref-email-notif').checked;
        const eventReminders = document.getElementById('pref-announcements').checked;

        const payload = {
          name,
          phone,
          organizationNumber,
          interests,
          preferences: {
            emailNotifications,
            eventReminders,
          },
        };

        if (newPass && newPass.length >= 6) {
          payload.password = newPass;
        }

        try {
          const res = await api.put(`/api/users/${currentUser._id}`, payload);
          if (res.success && res.data) {
            Auth.updateLocalUser(res.data);
            Utils.showToast('Profile updated successfully!', 'success');
            await loadProfileData();
            document.getElementById('prof-new-pass').value = '';
          }
        } catch (error) {
          Utils.showToast(error.message, 'error');
        } finally {
          saveBtn.disabled = false;
          saveBtn.innerText = 'Save Profile Changes';
        }
      });
    });

    async function loadProfileData() {
      try {
        const res = await api.get('/api/auth/me');
        if (res.success && res.data) {
          currentUser = res.data;
          Auth.updateLocalUser(currentUser);

          document.getElementById('profile-avatar-display').innerText = currentUser.name.charAt(0).toUpperCase();
          document.getElementById('profile-name-header').innerText = currentUser.name;
          document.getElementById('profile-email-header').innerText = currentUser.email;
          document.getElementById('profile-role-badge').innerText = currentUser.role.toUpperCase();

          const verifiedBadge = document.getElementById('profile-verified-badge');
          if (currentUser.isVerified) {
            verifiedBadge.innerText = 'VERIFIED';
            verifiedBadge.className = 'badge bg-success bg-opacity-25 text-white border border-white border-opacity-25 small';
          } else {
            verifiedBadge.innerText = 'PENDING VERIFICATION';
            verifiedBadge.className = 'badge bg-warning text-dark small';
          }

          document.getElementById('prof-name').value = currentUser.name;
          document.getElementById('prof-phone').value = currentUser.phone;
          document.getElementById('prof-email').value = currentUser.email;
          document.getElementById('prof-org').value = currentUser.organizationNumber || '';

          if (currentUser.role !== 'organizer') {
            document.getElementById('prof-org-group').classList.add('d-none');
          }

          // Interests
          const userInterests = currentUser.interests || [];
          document.querySelectorAll('input[name="prof-interest"]').forEach(cb => {
            cb.checked = userInterests.includes(cb.value);
          });

          // Preferences
          if (currentUser.preferences) {
            document.getElementById('pref-email-notif').checked = currentUser.preferences.emailNotifications !== false;
            document.getElementById('pref-announcements').checked = currentUser.preferences.eventReminders !== false;
          }
        }
      } catch (err) {
        Utils.showToast('Failed to load user profile: ' + err.message, 'error');
      }
    }
  </script>
</body>
</html>
