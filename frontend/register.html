<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | College Event Management System</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">

  <div id="navbar-container"></div>

  <div class="container py-5 my-auto">
    <div class="row justify-content-center">
      <div class="col-md-9 col-lg-6">
        <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
          <div class="p-4 p-sm-5 bg-white">
            <div class="text-center mb-4">
              <div class="navbar-brand-icon mx-auto mb-3" style="width:48px; height:48px; font-size:1.5rem;">
                <i class="bi bi-person-plus-fill"></i>
              </div>
              <h3 class="fw-bold text-dark">Create Your Account</h3>
              <p class="text-muted small">Join your campus community to discover, organize, and attend events</p>
            </div>

            <!-- Role Selector Tabs -->
            <div class="p-1 mb-4 rounded-3 bg-light border d-flex">
              <button type="button" class="btn btn-sm flex-grow-1 fw-bold rounded-2 btn-primary" id="role-student-btn" onclick="setRole('student')">
                <i class="bi bi-mortarboard me-1"></i> I'm a Student
              </button>
              <button type="button" class="btn btn-sm flex-grow-1 fw-bold rounded-2 text-muted" id="role-organizer-btn" onclick="setRole('organizer')">
                <i class="bi bi-megaphone me-1"></i> Club / Organizer
              </button>
            </div>

            <div id="register-alert" class="alert alert-danger d-none" role="alert"></div>

            <form id="register-form">
              <input type="hidden" id="role" value="student">

              <!-- Full Name -->
              <div class="mb-3">
                <label for="name" class="form-label small fw-semibold">Full Name / Organization Name <span class="text-danger">*</span></label>
                <div class="input-group">
                  <span class="input-group-text bg-white text-muted"><i class="bi bi-person"></i></span>
                  <input type="text" id="name" class="form-control ps-2" placeholder="e.g. Alex Rivera or Robotics Society" required minlength="2" maxlength="100">
                </div>
              </div>

              <!-- Email -->
              <div class="mb-3">
                <label for="email" class="form-label small fw-semibold">Campus Email Address <span class="text-danger">*</span></label>
                <div class="input-group">
                  <span class="input-group-text bg-white text-muted"><i class="bi bi-envelope"></i></span>
                  <input type="email" id="email" class="form-control ps-2" placeholder="name@college.com" required>
                </div>
                <div class="form-text small">RFC 5322 format (e.g. student@college.com)</div>
              </div>

              <!-- Phone -->
              <div class="mb-3">
                <label for="phone" class="form-label small fw-semibold">Phone Number <span class="text-danger">*</span></label>
                <div class="input-group">
                  <span class="input-group-text bg-white text-muted"><i class="bi bi-telephone"></i></span>
                  <input type="tel" id="phone" class="form-control ps-2" placeholder="+14155550100" required>
                </div>
                <div class="form-text small">10 to 15 digits (e.g. +14155550100 or 9876543210)</div>
              </div>

              <!-- Organizer Registration Number (Conditional) -->
              <div class="mb-3 d-none" id="org-number-group">
                <label for="orgNumber" class="form-label small fw-semibold">Organization Registration Number <span class="text-danger">*</span></label>
                <div class="input-group">
                  <span class="input-group-text bg-white text-muted"><i class="bi bi-card-checklist"></i></span>
                  <input type="text" id="orgNumber" class="form-control ps-2" placeholder="e.g. CEC-2026-REG-882">
                </div>
                <div class="form-text small text-warning">
                  <i class="bi bi-shield-lock me-1"></i> Organizer accounts require administrator verification before publishing events.
                </div>
              </div>

              <!-- Password -->
              <div class="mb-3">
                <label for="password" class="form-label small fw-semibold">Password <span class="text-danger">*</span></label>
                <div class="input-group">
                  <span class="input-group-text bg-white text-muted"><i class="bi bi-lock"></i></span>
                  <input type="password" id="password" class="form-control ps-2" placeholder="Minimum 6 characters" required minlength="6">
                </div>
              </div>

              <!-- Interests -->
              <div class="mb-4">
                <label class="form-label small fw-semibold d-block">Areas of Interest / Event Categories</label>
                <div class="d-flex flex-wrap gap-2">
                  <div class="form-check form-check-inline m-0">
                    <input class="btn-check" type="checkbox" name="interest" id="int-workshop" value="Workshop" checked>
                    <label class="btn btn-sm btn-outline-primary rounded-pill px-3" for="int-workshop">Workshop</label>
                  </div>
                  <div class="form-check form-check-inline m-0">
                    <input class="btn-check" type="checkbox" name="interest" id="int-cultural" value="Cultural" checked>
                    <label class="btn btn-sm btn-outline-primary rounded-pill px-3" for="int-cultural">Cultural</label>
                  </div>
                  <div class="form-check form-check-inline m-0">
                    <input class="btn-check" type="checkbox" name="interest" id="int-academic" value="Academic" checked>
                    <label class="btn btn-sm btn-outline-primary rounded-pill px-3" for="int-academic">Academic</label>
                  </div>
                  <div class="form-check form-check-inline m-0">
                    <input class="btn-check" type="checkbox" name="interest" id="int-sports" value="Sports">
                    <label class="btn btn-sm btn-outline-primary rounded-pill px-3" for="int-sports">Sports</label>
                  </div>
                  <div class="form-check form-check-inline m-0">
                    <input class="btn-check" type="checkbox" name="interest" id="int-social" value="Social">
                    <label class="btn btn-sm btn-outline-primary rounded-pill px-3" for="int-social">Social</label>
                  </div>
                  <div class="form-check form-check-inline m-0">
                    <input class="btn-check" type="checkbox" name="interest" id="int-seminar" value="Seminar">
                    <label class="btn btn-sm btn-outline-primary rounded-pill px-3" for="int-seminar">Seminar</label>
                  </div>
                </div>
              </div>

              <button type="submit" id="submit-btn" class="btn btn-primary w-100 py-2 rounded-3 fw-bold">
                Complete Registration
              </button>
            </form>

            <div class="text-center mt-4 pt-3 border-top">
              <span class="text-muted small">Already have an account? </span>
              <a href="/login.html" class="fw-bold small text-primary">Sign In</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="footer-container"></div>
  <div id="toast-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/navbar.js"></script>

  <script>
    function setRole(role) {
      document.getElementById('role').value = role;
      const studentBtn = document.getElementById('role-student-btn');
      const orgBtn = document.getElementById('role-organizer-btn');
      const orgGroup = document.getElementById('org-number-group');
      const orgInput = document.getElementById('orgNumber');

      if (role === 'organizer') {
        orgBtn.className = 'btn btn-sm flex-grow-1 fw-bold rounded-2 btn-primary';
        studentBtn.className = 'btn btn-sm flex-grow-1 fw-bold rounded-2 text-muted';
        orgGroup.classList.remove('d-none');
        orgInput.required = true;
      } else {
        studentBtn.className = 'btn btn-sm flex-grow-1 fw-bold rounded-2 btn-primary';
        orgBtn.className = 'btn btn-sm flex-grow-1 fw-bold rounded-2 text-muted';
        orgGroup.classList.add('d-none');
        orgInput.required = false;
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('register-form');
      const alertBox = document.getElementById('register-alert');
      const submitBtn = document.getElementById('submit-btn');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        alertBox.classList.add('d-none');
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Creating Account...';

        const name = document.getElementById('name').value.trim();
        const email = document.getElementById('email').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const password = document.getElementById('password').value;
        const role = document.getElementById('role').value;
        const organizationNumber = document.getElementById('orgNumber').value.trim();

        // Collect checked interests
        const interestBoxes = document.querySelectorAll('input[name="interest"]:checked');
        const interests = Array.from(interestBoxes).map(b => b.value);

        try {
          const res = await api.post('/api/auth/register', {
            name,
            email,
            phone,
            password,
            role,
            organizationNumber: role === 'organizer' ? organizationNumber : '',
            interests,
          });

          if (res.success && res.data) {
            Auth.setAuthSession(res.data.token, res.data.user);
            Utils.showToast(res.message || 'Registration successful!', 'success');

            setTimeout(() => {
              if (res.data.user.role === 'organizer') {
                window.location.href = '/organizer-dashboard.html';
              } else {
                window.location.href = '/student-dashboard.html';
              }
            }, 1000);
          }
        } catch (error) {
          const errorMsg = error.message || 'Registration failed. Please check your inputs.';
          alertBox.innerText = errorMsg;
          alertBox.classList.remove('d-none');
          submitBtn.disabled = false;
          submitBtn.innerHTML = 'Complete Registration';
        }
      });
    });
  </script>
</body>
</html>
